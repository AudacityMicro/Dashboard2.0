name: Android capture inbox
on:
  pull_request:
  push:
    branches: [feature/capture-inbox]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;37.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :app:app:testDefaultDebugUnitTest :app:app:assembleDefaultDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-debug
          path: app/app/build/outputs/apk/default/debug/*.apk
